<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="description" content="ClassSync - A comprehensive class management system for CRs and students" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="ClassSync" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>ClassSync</title>
    
    <!-- Clear stale auth loading states on page load -->
    <script>
      try {
        const authLoading = localStorage.getItem('auth_loading');
        if (authLoading === 'true') {
          console.log('Clearing stuck auth_loading state');
          localStorage.removeItem('auth_loading');
        }
      } catch (e) {
        console.error('Error clearing stale state:', e);
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
